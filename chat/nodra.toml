[package]
name = "nodra-chat"
version = "1.1.0"
type = "service"
description = "Local chat and control UI for Nodra: chat with Claude Code, manage packages and sources, services, MCP servers, knowledge and works. Runs on 127.0.0.1 only."
tags = ["nodra", "ui", "chat", "local"]
readme = "README.md"
license = "MIT"

[requires]
os = []

[service]
run = "ui/server.py"
title = "Nodra"
restart = "always"
unique = true
url_file = "ui/url.txt"

[[service.env]]
name = "UI_PORT"
hint = "port on 127.0.0.1 (0 = pick a free one; the address is written to ~/.nodra/ui/url.txt)"
required = false
default = "8765"

[[service.env]]
name = "UI_OPEN"
hint = "open the browser when the service starts (1 or 0)"
required = false
default = "1"
